<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CHELCIE Demos</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        padding: 24px;
      }

      .wrap {
        width: 100%;
        max-width: 720px;
        text-align: center;
      }

      h1 {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.01em;
        margin: 0 0 8px;
      }

      p.subtitle {
        margin: 0 0 40px;
        color: #a1a1aa;
        font-size: 15px;
      }

      .cards {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      @media (max-width: 600px) {
        .cards {
          grid-template-columns: 1fr;
        }
      }

      a.card {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        text-decoration: none;
        color: inherit;
        background: #141414;
        border: 1px solid #262626;
        border-radius: 16px;
        padding: 28px 24px;
        transition: border-color 0.15s ease, transform 0.15s ease, background 0.15s ease;
      }

      a.card:hover {
        border-color: #a51c30;
        background: #181414;
        transform: translateY(-2px);
      }

      .tag {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 3px 10px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      .tag.stable {
        background: rgba(16, 185, 129, 0.12);
        color: #34d399;
      }

      .tag.wip {
        background: rgba(165, 28, 48, 0.15);
        color: #f472b6;
      }

      .card h2 {
        margin: 4px 0 0;
        font-size: 18px;
        font-weight: 700;
      }

      .card p {
        margin: 0;
        font-size: 13px;
        color: #a1a1aa;
        text-align: left;
        line-height: 1.5;
      }

      .card .cta {
        margin-top: 12px;
        font-size: 13px;
        font-weight: 600;
        color: #f5f5f5;
      }

      footer {
        margin-top: 40px;
        font-size: 12px;
        color: #52525b;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>CHELCIE</h1>
      <p class="subtitle">Pick a version to open</p>

      <div class="cards">
        <a class="card" href="./old/">
          <span class="tag stable">Live</span>
          <h2>Original Demo</h2>
          <p>The current stable prototype.</p>
          <span class="cta">Open original demo &rarr;</span>
        </a>

        <a class="card" href="./new/">
          <span class="tag wip">In progress</span>
          <h2>New Demo</h2>
          <p>The shadcn/ui redesign — dashboard, Funding Priorities, and application flow.</p>
          <span class="cta">Open new demo &rarr;</span>
        </a>
      </div>

      <footer>Both versions are live builds of this repository.</footer>
    </div>
  </body>
</html>
