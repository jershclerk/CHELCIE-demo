# Deploy Vite site to Pages

name: Deploy Vite site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout original demo (main)
        uses: actions/checkout@v4
        with:
          path: original-demo

      - name: Checkout new demo (redesign-shadcn-v2)
        uses: actions/checkout@v4
        with:
          ref: redesign-shadcn-v2
          path: new-demo

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install & build original demo
        working-directory: original-demo
        run: |
          npm ci
          npx tsc -b
          npx vite build --outDir out --base /CHELCIE-demo/old/

      - name: Install & build new demo
        working-directory: new-demo
        run: |
          npm ci
          npx tsc -b
          npx vite build --outDir out --base /CHELCIE-demo/new/

      - name: Assemble site
        run: |
          mkdir -p site/old site/new
          cp -r original-demo/landing/. site/
          cp -r original-demo/out/. site/old/
          cp -r new-demo/out/. site/new/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
